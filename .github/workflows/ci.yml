name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar dependências
        run: dotnet restore AlertaSP.sln

      - name: Compilar
        run: dotnet build AlertaSP.sln --no-restore --configuration Release

      - name: Testar
        run: dotnet test AlertaSP.sln --no-build --configuration Release --logger "trx;LogFileName=resultados.trx" --results-directory TestResults

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-dos-testes
          path: TestResults
